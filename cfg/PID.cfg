#!/usr/bin/env python3
PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 定义四个轮子的 P、I、D 参数滑动条
# 参数名, 类型, 级别, 描述, 默认值, 最小值, 最大值
# 这里以左前轮为例，你可以给四个轮子都加上
gen.add("lf_p", double_t, 0, "Left Front P", 10.0, 0.0, 100.0)
gen.add("lf_i", double_t, 0, "Left Front I", 0.0, 0.0, 100.0)
gen.add("lf_d", double_t, 0, "Left Front D", 0.1, 0.0, 100.0)

# 为了演示，右侧轮子也顺便加上
gen.add("rf_p", double_t, 0, "Right Front P", 10.0, 0.0, 100.0)
gen.add("rf_i", double_t, 0, "Right Front I", 0.0, 0.0, 100.0)
gen.add("rf_d", double_t, 0, "Right Front D", 0.1, 0.0, 100.0)

# 退出并生成头文件
exit(gen.generate(PACKAGE, "hero_chassis_controller", "PID"))