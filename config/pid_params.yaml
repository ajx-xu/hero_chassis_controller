joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

hero_chassis_controller:
  use_world_frame: false  # 设为 false：底盘坐标系（跟着车头走）
  # use_world_frame: true  # 设为 true：世界坐标系（无视车头，固定方向）
  type: hero_chassis_controller/HeroChassisController
  joints:
    - left_front_wheel_joint
    - right_front_wheel_joint
    - left_back_wheel_joint
    - right_back_wheel_joint
  wheel_radius: 0.076
  wheel_separation_x: 0.25
  wheel_separation_y: 0.22

  left_front_wheel_joint: {p: 10.0, i: 0.0, d: 0.1, i_clamp: 1.0}
  right_front_wheel_joint: {p: 10.0, i: 0.0, d: 0.1, i_clamp: 1.0}
  left_back_wheel_joint: {p: 10.0, i: 0.0, d: 0.1, i_clamp: 1.0}
  right_back_wheel_joint: {p: 10.0, i: 0.0, d: 0.1, i_clamp: 1.0}