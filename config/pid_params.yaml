hero_chassis_controller:
  type: hero_chassis_controller/HeroChassisController
  joints:
    - wheel_front_left_joint
    - wheel_front_right_joint
    - wheel_back_left_joint
    - wheel_back_right_joint
  wheel_radius: 0.076
  wheel_separation_x: 0.25
  wheel_separation_y: 0.25

  wheel_front_left_joint:
    p: 10.0
    i: 0.0
    d: 0.1
    i_clamp: 1.0
  wheel_front_right_joint:
    p: 10.0
    i: 0.0
    d: 0.1
    i_clamp: 1.0
  wheel_back_left_joint:
    p: 10.0
    i: 0.0
    d: 0.1
    i_clamp: 1.0
  wheel_back_right_joint:
    p: 10.0
    i: 0.0
    d: 0.1
    i_clamp: 1.0